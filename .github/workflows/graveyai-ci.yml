name: GraveyAI CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.lock' 'BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}' .; then
            echo 'Potential credential material detected.'
            exit 1
          fi

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          if find backend -name '*.py' -print -quit 2>/dev/null | grep -q .; then
            python -m compileall -q backend
          else
            echo 'No Python source detected; syntax validation skipped.'
          fi

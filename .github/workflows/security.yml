name: Security Baseline

on:
  push:
  pull_request:
  schedule:
    - cron: '30 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Analyze
        uses: github/codeql-action/analyze@v3

  dependency-review:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Dependency review placeholder
        run: echo 'Enable GitHub Dependency graph before activating dependency-review-action.'
